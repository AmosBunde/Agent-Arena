# CI for pull requests into dev and main, plus post-merge runs on dev.
#
# Gates: ruff lint and format, mypy strict on packages/, pytest (unit and
# Docker-backed integration), TypeScript lint/type/test once apps/web exists,
# and a smoke deploy. The smoke job adapts to what is deployable: it uses the
# full single-VM stack (deploy/compose/compose.yml, issue #12) and hits
# /health when that file exists, and falls back to the Postgres slice plus
# Alembic migrations until then. No CI edit is needed when the full stack
# lands.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps
      - name: mypy
        run: mypy

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps
      - name: pytest
        run: pytest -q

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for TypeScript workspace
        id: ts
        run: |
          if [ -f apps/web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/web/package.json not found; TypeScript checks are skipped until issue #11 lands."
          fi
      - uses: actions/setup-node@v4
        if: steps.ts.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        if: steps.ts.outputs.present == 'true'
        working-directory: apps/web
        run: npm ci
      - name: eslint
        if: steps.ts.outputs.present == 'true'
        working-directory: apps/web
        run: npm run lint
      - name: tsc
        if: steps.ts.outputs.present == 'true'
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: vitest
        if: steps.ts.outputs.present == 'true'
        working-directory: apps/web
        run: npm test -- --run

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps
      - name: Smoke deploy
        run: |
          set -euo pipefail
          if [ -f deploy/compose/compose.yml ]; then
            echo "Full stack found; deploying and probing /health."
            docker compose -f deploy/compose/compose.yml up -d --build
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:8000/health; then
                echo
                echo "Health check passed."
                exit 0
              fi
              sleep 2
            done
            echo "Health check did not pass in time." >&2
            docker compose -f deploy/compose/compose.yml logs
            exit 1
          else
            echo "Full stack not present yet (issue #12); smoking the Postgres slice and migrations."
            docker compose -f deploy/compose/postgres.yml up -d --wait
            DATABASE_URL=postgresql+psycopg://arena:arena@localhost:5432/arena alembic upgrade head
            DATABASE_URL=postgresql+psycopg://arena:arena@localhost:5432/arena alembic downgrade base
          fi
      - name: Teardown
        if: always()
        run: |
          docker compose -f deploy/compose/compose.yml down -v 2>/dev/null || true
          docker compose -f deploy/compose/postgres.yml down -v 2>/dev/null || true
