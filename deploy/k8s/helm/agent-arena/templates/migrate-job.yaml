# Migrations run exactly once per release rollout, before the api pods roll
# (database-schema.md, Migration approach). The api deployment itself never
# migrates in K8s: with multiple replicas that would race.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agent-arena.fullname" . }}-migrate
  labels:
    {{- include "agent-arena.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "agent-arena.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "agent-arena.appEnv" . | nindent 12 }}
