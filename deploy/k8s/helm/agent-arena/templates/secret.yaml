apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-arena.fullname" . }}-env
  labels:
    {{- include "agent-arena.labels" . | nindent 4 }}
  annotations:
    # The migration Job is a pre-install hook and reads this secret, so the
    # secret must exist before regular release resources are created. Hook
    # weight -5 orders it ahead of the Job (weight 0);
    # before-hook-creation keeps it updated across upgrades. Helm does not
    # delete hook resources on uninstall; remove it manually with the
    # release if needed.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ required "externalPostgres.url is required" .Values.externalPostgres.url | quote }}
  REDIS_URL: {{ required "externalRedis.url is required" .Values.externalRedis.url | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.objectStore.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.objectStore.secretAccessKey | quote }}
