apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-arena.fullname" . }}-env
  labels:
    {{- include "agent-arena.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "externalPostgres.url is required" .Values.externalPostgres.url | quote }}
  REDIS_URL: {{ required "externalRedis.url is required" .Values.externalRedis.url | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.objectStore.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.objectStore.secretAccessKey | quote }}
