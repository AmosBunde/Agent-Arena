apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-arena.fullname" . }}-api
  labels:
    {{- include "agent-arena.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agent-arena.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "agent-arena.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          env:
            {{- include "agent-arena.appEnv" . | nindent 12 }}
            - name: API_DEFAULT_ROLE
              value: {{ .Values.api.defaultRole | quote }}
            - name: RUN_MIGRATIONS
              value: "0"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-arena.fullname" . }}-api
  labels:
    {{- include "agent-arena.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "agent-arena.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - port: 8000
      targetPort: http
      name: http
