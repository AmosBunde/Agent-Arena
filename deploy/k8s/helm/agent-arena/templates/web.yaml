apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-arena.fullname" . }}-web
  labels:
    {{- include "agent-arena.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agent-arena.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "agent-arena.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.webImage.repository }}:{{ .Values.webImage.tag }}"
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          env:
            - name: API_UPSTREAM
              value: "{{ include "agent-arena.fullname" . }}-api:8000"
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-arena.fullname" . }}-web
  labels:
    {{- include "agent-arena.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "agent-arena.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - port: 80
      targetPort: http
      name: http
