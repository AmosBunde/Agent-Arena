# Standalone Postgres 16 service for local development and CI.
#
# This is the database slice only. The full single-VM application stack
# (API, runner, web, Redis, MinIO) lands with issue #12; that compose file
# reuses the same image, version, and tuning so behaviour matches.
#
#   docker compose -f deploy/compose/postgres.yml up -d
#   DATABASE_URL=postgresql+psycopg://arena:arena@localhost:5432/arena alembic upgrade head

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena}
      POSTGRES_DB: ${POSTGRES_DB:-arena}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arena} -d ${POSTGRES_DB:-arena}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
