[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-arena"
version = "0.0.0"
description = "Cost-aware, provider-agnostic evaluation platform for LLM agents."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "pyyaml>=6,<7",
    "openai>=2.0,<3",
    "google-genai>=2.0,<3",
    "anthropic>=0.69,<1",
    "httpx>=0.28,<1",
    "celery>=5.4,<6",
    "redis>=5,<7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pytest>=8.0,<9.0",
    "testcontainers[postgres]>=4.0,<5.0",
    "types-PyYAML>=6,<7",
    "pip-tools>=7,<8",
]

# Importable code is the PEP 420 ``agent_arena`` namespace, assembled from one
# directory per area (db, adapters, schemas, ...). setuptools' package finder
# cannot split a single namespace across multiple roots, so each area's
# concrete subpackages are mapped explicitly. New areas append their entries
# to ``packages`` and ``package-dir`` as they land.
[tool.setuptools]
packages = [
    "agent_arena.db",
    "agent_arena.db.models",
    "agent_arena.adapters",
    "agent_arena.cost_models",
    "agent_arena.cost_models.data",
]

[tool.setuptools.package-dir]
"agent_arena.db" = "packages/db/agent_arena/db"
"agent_arena.adapters" = "packages/adapters/agent_arena/adapters"
"agent_arena.cost_models" = "packages/cost-models/agent_arena/cost_models"

[tool.setuptools.package-data]
"agent_arena.db" = ["py.typed"]
"agent_arena.adapters" = ["py.typed"]
"agent_arena.cost_models" = ["py.typed", "data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
# The importable ``agent_arena`` namespace is assembled from packages/<area>;
# each area's root goes on mypy_path so the fully-qualified module name is
# unambiguous. New areas append their root here as they land.
mypy_path = ["packages/db", "packages/adapters", "packages/cost-models", "."]
explicit_package_bases = true
namespace_packages = true
files = [
    "packages/db/agent_arena",
    "packages/adapters/agent_arena",
    "packages/cost-models/agent_arena",
    "apps/runner",
]
plugins = ["sqlalchemy.ext.mypy.plugin"]

# Apps are services, not public packages: type-check them without --strict.
[[tool.mypy.overrides]]
module = "apps.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

# Celery ships no py.typed marker.
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
markers = [
    "integration: tests that require Docker (spin real services such as Postgres)",
]
