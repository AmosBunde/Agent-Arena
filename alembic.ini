# Alembic configuration for Agent Arena.
#
# The database URL is supplied at runtime via the DATABASE_URL environment
# variable (see migrations/env.py); the value below is only a non-functional
# placeholder so tooling that parses this file does not choke.
[alembic]
script_location = migrations
prepend_sys_path = packages/db
path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
